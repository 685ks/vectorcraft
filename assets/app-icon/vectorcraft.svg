<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- VectorCraft app icon, Arthavan Projects house style: a light glyph on a dark tile in the app's own tint.
       Original artwork drawn in code, MIT OR Apache-2.0 like the repository. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d2335"/>
      <stop offset="1" stop-color="#1a0a11"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="4"/>
  <g fill="none" stroke="#e198b7" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M132 360 C 170 200, 342 312, 380 152" />
    <path d="M132 360 L 196 250 M380 152 L 316 262" stroke-width="12" stroke="#f4c2d7"/>
    <circle cx="196" cy="250" r="18" fill="#f4c2d7" stroke="none"/>
    <circle cx="316" cy="262" r="18" fill="#f4c2d7" stroke="none"/>
    <rect x="104" y="332" width="56" height="56" rx="8" fill="#1a0a11" stroke-width="16"/>
    <rect x="352" y="124" width="56" height="56" rx="8" fill="#1a0a11" stroke-width="16"/>
  </g>
  </g>
</svg>
