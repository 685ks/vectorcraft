# Quick static checks for the release pipeline (seconds, no Rust build): workflow syntax,
# packaging shell scripts, the WiX XML and packaging/app.toml.
name: Packaging lint

on:
  push:
    branches: [main, release]
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  pull_request:
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 10
    name: Desktop metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils shellcheck
      - name: Validate the WiX XML and release metadata
        run: |
          set -euo pipefail
          xmllint --noout packaging/windows/vectorcraft.wxs
          python3 -c 'import tomllib; d = tomllib.load(open("packaging/app.toml", "rb")); assert d["bundle_id"] == "app.freedev.ainz.ks.VectorCraft" and d["publisher"] == "Arthavan Projects", d'
      - name: Shell scripts
        run: shellcheck -S error packaging/*.sh packaging/web/*.sh
