# Checks on every pull request and every push to main: the steps of
# `cargo xtask ci` (formatting, Clippy, the PDF dependency, asset, brand, cursor and layering checks,
# the wasm check and the tests), plus the rebrand guard. Lint runs on
# Linux (tooling only); the tests run on Windows.
#
# Every action is pinned by commit SHA. Values from the event go through `env:`, never straight
# into a `run:` script. Tests that need a GPU, the corpus or craft-fonts skip themselves, so the
# runners need none of those.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Tests never touch the user's settings.
  VECTORCRAFT_NO_PREFS: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Format
        run: cargo fmt --all -- --check
      # This fork carries no ArtCraft marks or links and no storytold/craft-common-actions
      # workflows (house rules). LICENSE and NOTICE keep the upstream copyright line.
      - name: Rebrand guard
        run: |
          set -euo pipefail
          if git grep -nI 'craft-common-actions' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::storytold/craft-common-actions is not used in this fork"; exit 1
          fi
          if git grep -nIi -e 'getartcraft' -e 'discord\.gg/artcraft' -e 'storyteller\.ai' -e 'ai\.storyteller\.vectorcraft' -- . ':!.github/workflows/ci.yml' ':!xtask/src/brands.rs'; then
            echo "::error::ArtCraft/storyteller links or ids remain"; exit 1
          fi
          if [ -d docs/brand ]; then echo "::error::docs/brand (ArtCraft marks) must not exist"; exit 1; fi
      - name: Install Linux system dependencies (egui/winit/rfd)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: PDF dependency, assets, brands, cursors and layering
        run: |
          cargo xtask pdf-deps
          cargo xtask assets
          cargo xtask brands
          cargo xtask cursors
          cargo xtask layers
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: wasm32 check
        run: cargo xtask wasm

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest@0.9.146
      - name: Test the workspace
        shell: bash
        run: cargo nextest run --locked --workspace --no-fail-fast
      - name: Doc tests
        shell: bash
        run: cargo test --locked --workspace --doc
      - name: vectorcraft-text without its bundled fonts
        shell: bash
        run: cargo test --locked -p vectorcraft-text --no-default-features --test without_bundled_fonts
